name: Android release

on:
  workflow_dispatch:
    inputs:
      publish_privacy:
        description: Publish the privacy policy to GitHub Pages
        type: boolean
        required: true
        default: true
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/release.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Signing secrets are required'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
      - name: Test, lint and build signed release
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintRelease assembleRelease bundleRelease --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: qr-scanner-pro-${{ github.run_number }}
          retention-days: 14
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/lint-results-release.xml
            app/build/test-results/testDebugUnitTest/TEST-*.xml
      - name: Remove signing key
        if: always()
        run: rm -f "$KEYSTORE_PATH"

  privacy-page:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_privacy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare privacy page
        run: |
          mkdir -p _privacy
          cp index.html _privacy/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _privacy
      - name: Deploy privacy policy
        id: deployment
        uses: actions/deploy-pages@v4
